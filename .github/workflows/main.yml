name: Release

on: [ workflow_dispatch ]

jobs:
  release:
    name: Publish a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get Project Info from Gradle
        run: |
          PROPS="$(./gradlew properties -q)"
          echo "version=$(printf '%s\n' "$PROPS" | grep '^version:' | sed 's/^version: //')" >> $GITHUB_OUTPUT
          echo "name=$(printf '%s\n' "$PROPS" | grep '^name:' | sed 's/^name: //')" >> $GITHUB_OUTPUT
        id: project
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          name: "${{ steps.project.outputs.name }} v${{ steps.project.outputs.version }}"
          tag: "v${{ steps.project.outputs.version }}"
          artifacts: "build/libs/${{ steps.project.outputs.name }}-${{ steps.project.outputs.version }}.jar"
          artifactContentType: application/java-archive
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
