name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 25
          distribution: 'adopt'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get Version from Properties
        run: echo "version=$(./gradlew printVersion -q)" >> $GITHUB_OUTPUT
        id: version
      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          name: "ChatFixs v${{ steps.version.outputs.version }}"
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload Java File
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "build/libs/ChatFixs-${{ steps.version.outputs.version }}.jar"
          asset_name: ChatFixs-${{ steps.version.outputs.version }}.jar
          asset_content_type: application/java-archive
